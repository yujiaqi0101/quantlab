# QuantLab 全局配置 — 应用层
app:
  name: QuantLab
  version: 1.0.0
  env: development  # development / testing / production
  debug: true
  host: 0.0.0.0
  port: 8000

# 日志
logging:
  level: INFO  # DEBUG / INFO / WARNING / ERROR
  dir: logs
  max_size_mb: 50
  backup_count: 5
  modules:
    app: app.log
    pipeline: pipeline.log
    research: research.log
    error: error.log

# 数据存储
storage:
  data_dir: storage/data
  cache_dir: storage/cache
  artifact_dir: storage/artifacts
  db_path: storage/quantlab.db
  alpha_db_path: storage/alpha.db
